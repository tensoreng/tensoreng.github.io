<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <title>规则管理模块</title>

  <link rel="stylesheet" href="https://unpkg.com/element-plus/dist/index.css">

  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
  <script src="https://unpkg.com/element-plus"></script>

  <style>
    body {
      margin: 0;
      background: #f5f7fa;
      font-family: Arial;
    }

    .container {
      padding: 20px;
    }

    .card {
      background: white;
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 20px;
    }

    .section-title {
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 15px;
    }

    .row {
      display: flex;
      gap: 12px;
      margin-bottom: 12px;
      align-items: center;
    }

    .field-box {
      border: 1px solid #dcdfe6;
      border-radius: 6px;
      padding: 12px;
      margin-bottom: 10px;
      background: #fafafa;
    }

    .reserve-box {
      border: 1px dashed #c0c4cc;
      padding: 12px;
      margin-bottom: 10px;
      border-radius: 6px;
      background: #fcfcfc;
    }
  </style>
</head>

<body>

  <div id="app" class="container">

    <!-- SINGLE_IP -->
    <div class="card" v-if="rule.template === 'SINGLE_IP'">

      <div class="section-title">
        基础配置
      </div>

      <div class="row">
        <el-input v-model="rule.name" placeholder="规则名称" style="width:200px">
        </el-input>
        <el-select v-model="rule.template" style="width:220px">
          <el-option label="单IP模板" value="SINGLE_IP">
          </el-option>
          <el-option label="互联模板" value="P2P">
          </el-option>
          <el-option label="子网模板" value="SUBNET">
          </el-option>
        </el-select>
      </div>

    </div>

    <div class="card" v-if="rule.template === 'SINGLE_IP'">

      <div class="section-title">
        IP字段配置
      </div>

      <div class="field-box" v-for="(field,index) in rule.ipFields" :key="index">

        <div class="row">

          <el-select v-model="field.field" style="width:220px">

            <el-option v-for="item in ipFieldOptions" :key="item.value" :label="item.label" :value="item.value">
            </el-option>

          </el-select>

          <el-checkbox v-model="field.required">
            必填
          </el-checkbox>

          <el-button type="danger" @click="removeIpField(index)">
            删除
          </el-button>

        </div>

      </div>

      <el-button type="primary" @click="addIpField">
        新增IP字段
      </el-button>

    </div>


    <!-- 掩码位数配置 -->
    <div class="card" v-if="rule.template === 'P2P' || rule.template === 'SUBNET'">

      <div class="section-title">
        基础配置
      </div>

      <div class="row">
        <el-input v-model="rule.name" placeholder="规则名称" style="width:200px">
        </el-input>
        <el-select v-model="rule.template" style="width:220px">
          <el-option label="单IP模板" value="SINGLE_IP">
          </el-option>
          <el-option label="互联模板" value="P2P">
          </el-option>
          <el-option label="子网模板" value="SUBNET">
          </el-option>
        </el-select>
      </div>

      <div class="row">

        <span style="width:90px">最小掩码</span>
        <el-input-number v-model="maskConfig.min" :min="1" :max="32" controls-position="right" style="width:90px">
        </el-input-number>

        <span style="width:90px;margin-left:15px">最大掩码</span>
        <el-input-number v-model="maskConfig.max" :min="1" :max="32" controls-position="right" style="width:90px">
        </el-input-number>

        <span style="width:70px;margin-left:15px">默认掩码</span>
        <el-input-number v-model="rule.defaultMask" :min="maskConfig.min" :max="maskConfig.max"
          controls-position="right" style="width:90px">
        </el-input-number>

      </div>

      <div class="row" v-if="rule.template === 'SUBNET'"
        style="margin-top:12px;padding-top:12px;border-top:1px dashed #e4e7ed">
        <span style="width:90px">是否分配VLAN</span>
        <el-switch v-model="rule.assignVlan" active-text="是" inactive-text="否">
        </el-switch>

      </div>
      <div class="row" v-if="rule.template === 'SUBNET'"
        style="margin-top:12px;padding-top:12px;border-top:1px dashed #e4e7ed">
        <span style="width:90px;">分配地址</span>
        <el-select v-model="rule.addressType" style="width:120px">
          <el-option v-for="item in ipTypes" :key="item.value" :label="item.label" :value="item.value">
          </el-option>
        </el-select>
      </div>
    </div>

    <!-- SUBNET -->

    <div class="card" v-if="rule.template === 'SUBNET'">

      <div class="section-title">
        子网字段配置
      </div>

      <div class="field-box" v-for="(field,index) in rule.subnetFields" :key="index">

        <div class="row">

          <el-select v-model="field.field" style="width:220px">

            <el-option v-for="item in subnetFieldOptions" :key="item.value" :label="item.label" :value="item.value">
            </el-option>

          </el-select>

          <el-checkbox v-model="field.required">
            必填
          </el-checkbox>

          <el-button type="danger" @click="removeSubnetField(index)">
            删除
          </el-button>

        </div>

      </div>

      <el-button type="primary" @click="addSubnetField">
        新增子网字段
      </el-button>

    </div>


    <div class="card" v-if="rule.template === 'SUBNET'">

      <div class="section-title">
        IP字段配置
      </div>

      <div class="field-box" v-for="(field,index) in rule.ipFields" :key="index">

        <div class="row">

          <el-select v-model="field.field" style="width:220px">

            <el-option v-for="item in ipFieldOptions" :key="item.value" :label="item.label" :value="item.value">
            </el-option>

          </el-select>

          <el-checkbox v-model="field.required">
            必填
          </el-checkbox>

          <el-button type="danger" @click="removeIpField(index)">
            删除
          </el-button>

        </div>

      </div>

      <el-button type="primary" @click="addIpField">
        新增IP字段
      </el-button>

    </div>


    <!-- 预留规则 -->

    <div class="card" v-if="rule.template === 'SUBNET'">

      <div class="section-title">
        预留规则
      </div>

      <div class="reserve-box" v-for="(reserve,index) in rule.reservations" :key="index">

        <div class="row">

          <el-select v-model="reserve.position" style="width:120px">

            <el-option label="前置" value="start"></el-option>
            <el-option label="后置" value="end"></el-option>

          </el-select>

          <el-input-number v-model="reserve.count" :min="1">
          </el-input-number>

          <el-select v-model="reserve.ipType" style="width:180px">

            <el-option v-for="item in ipTypes" :key="item.value" :label="item.label" :value="item.value">
            </el-option>

          </el-select>

          <el-button type="danger" @click="removeReservation(index)">
            删除
          </el-button>

        </div>

      </div>

      <el-button type="primary" @click="addReservation">
        新增预留规则
      </el-button>

    </div>


    <!-- 预览申请单 -->

    <div class="card">

      <div class="section-title">
        预览申请单
      </div>

      <!-- SINGLE_IP 申请单 -->
      <div v-if="rule.template === 'SINGLE_IP'">
        <el-table :data="[{}]" border>
          <el-table-column prop="address" label="地址段" width="200">
            <template #default>
              <span style="color:#909399">192.168.1.100/32</span>
            </template>
          </el-table-column>
          <el-table-column v-for="(f, idx) in rule.ipFields" :key="idx" :label="getFieldLabel(f.field, 'ip')"
            min-width="120">
          </el-table-column>
        </el-table>
      </div>

      <!-- P2P 申请单 -->
      <div v-if="rule.template === 'P2P'">
        <el-table :data="[{}]" border>
          <el-table-column prop="address" label="地址段" width="200">
            <template #default>
              <span style="color:#909399">192.168.1.0/30</span>
            </template>
          </el-table-column>
          <el-table-column prop="mask" label="掩码位数" width="100">
            <template #default>
              <span style="color:#909399">{{ rule.defaultMask }}</span>
            </template>
          </el-table-column>
          <el-table-column prop="deviceA" label="互联设备A" width="150">
            <template #default>
              <span style="color:#909399">LF-Device1</span>
            </template>
          </el-table-column>
          <el-table-column prop="deviceB" label="互联设备B" width="150">
            <template #default>
              <span style="color:#909399">LF-Device2</span>
            </template>
          </el-table-column>
        </el-table>
      </div>

      <!-- SUBNET 申请单 -->
      <div v-if="rule.template === 'SUBNET'">
        <el-table :data="[{}]" border>
          <el-table-column prop="address" label="地址段" width="200">
            <template #default>
              <span style="color:#909399">192.168.0.0/24</span>
            </template>
          </el-table-column>
          <el-table-column prop="count" label="地址数量" width="100">
            <template #default>
              <span style="color:#909399">256</span>
            </template>
          </el-table-column>
          <el-table-column prop="mask" label="掩码位数" width="100">
            <template #default>
              <span style="color:#909399">{{ rule.defaultMask }}</span>
            </template>
          </el-table-column>
          <el-table-column v-for="(f, idx) in rule.subnetFields" :key="'subnet-' + idx"
            :label="getFieldLabel(f.field, 'subnet')" min-width="120">
          </el-table-column>
          <el-table-column v-for="(f, idx) in rule.ipFields" :key="'ip-' + idx" :label="getFieldLabel(f.field, 'ip')"
            min-width="120">
          </el-table-column>
        </el-table>
      </div>

    </div>

  </div>

  <script>

    const { createApp } = Vue

    createApp({

      data() {

        return {

          subnetFieldOptions: [
            { label: '关联设备', value: 'device' },
            { label: '业务系统', value: 'biz_system' },
            { label: '备注', value: 'remark' }
          ],

          ipFieldOptions: [
            { label: '关联设备', value: 'device' },
            { label: '业务系统', value: 'biz_system' },
            { label: '域名', value: 'domain' },
            { label: '映射方式', value: 'map_type' },
            { label: '实际地址', value: 'real_address' },
            { label: '对端单位', value: 'peer_unit' },
            { label: '主机名', value: 'hostname' },
            { label: '备注', value: 'remark' }
          ],

          ipTypes: [
            { label: '网络地址', value: 'network' },
            { label: '交换机地址', value: 'switch' },
            { label: 'DHCP Pool地址', value: 'dhcp' },
            { label: '主机地址', value: 'host' },
            { label: '预留', value: 'reserved' },
            { label: '网关地址', value: 'gateway' },
            { label: '广播地址', value: 'broadcast' }
          ],

          maskConfig: {
            min: 24,
            max: 30
          },

          rule: {

            name: '',

            template: 'SUBNET',

            subnetFields: [

            ],

            ipFields: [

            ],

            reservations: [

            ],

            assignVlan: false,

            addressType: 'host',

            defaultMask: 30

          }

        }

      },

      watch: {

        'rule.template'(val) {

          // 切换模板时重置结构

          if (val === 'SINGLE_IP') {

            this.rule.subnetFields = []
            this.rule.reservations = []

          }

          if (val === 'P2P') {

            this.rule.subnetFields = []
            this.rule.ipFields = []
            this.rule.reservations = []

          }

          if (val === 'SUBNET') {

            if (!this.rule.subnetFields) {
              this.rule.subnetFields = []
            }

            if (!this.rule.ipFields) {
              this.rule.ipFields = []
            }

            if (!this.rule.reservations) {
              this.rule.reservations = []
            }

          }

        }

      },

      computed: {

        availableMaskBits() {
          const bits = []
          const min = Math.min(this.maskConfig.min, this.maskConfig.max)
          const max = Math.max(this.maskConfig.min, this.maskConfig.max)
          for (let i = min; i <= max; i++) {
            bits.push(i)
          }
          return bits
        }

      },

      methods: {

        addSubnetField() {

          this.rule.subnetFields.push({
            field: '',
            required: true
          })

        },

        removeSubnetField(index) {
          this.rule.subnetFields.splice(index, 1)
        },

        addIpField() {

          this.rule.ipFields.push({
            field: '',
            required: true
          })

        },

        removeIpField(index) {
          this.rule.ipFields.splice(index, 1)
        },

        addReservation() {

          this.rule.reservations.push({
            position: 'start',
            count: 1,
            ipType: 'reserved'
          })

        },

        removeReservation(index) {
          this.rule.reservations.splice(index, 1)
        },

        formatJson(data) {
          return JSON.stringify(data, null, 2)
        },

        getFieldLabel(fieldValue, type) {
          const options = type === 'ip' ? this.ipFieldOptions : this.subnetFieldOptions
          const found = options.find(item => item.value === fieldValue)
          return found ? found.label : fieldValue
        }

      }

    }).use(ElementPlus).mount('#app')

  </script>

</body>

</html>
